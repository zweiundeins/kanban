root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go tool templ generate"]
  cmd = "go build -o ./tmp/kanban ./cmd/kanban"
  entrypoint = ["./tmp/kanban", "serve", "-db", "data/kanban.db", "-debug"]
  include_ext = ["go", "templ", "css", "js", "svg", "sql"]
  exclude_dir = ["tmp", "data", "e2e", "node_modules", "benchmarks"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  delay = 200
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = false

[misc]
  clean_on_exit = true
